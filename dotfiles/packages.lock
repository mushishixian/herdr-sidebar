# dotfiles/packages.lock — the versions every machine converges to.
#
# Imported by dotfiles/install.sh; asserted by dotfiles/verify.sh.
#
# Format: tab-separated, one entry per line, `#` starts a comment. Anything not
# listed here is NOT pinned (apt packages come from the distro's release, and
# herdr/Fresh/rustup update themselves), so add a line only when a version skew
# between machines would actually bite.
#
#   uv       <name> <version> [extras]   uv tool install '<name>[<extras>]==<version>'
#   uv-with  <name> <package==version>   ... --with '<package==version>'
#
# `uv-with` is for a requirement that provides no executables of its own (a
# plugin/adapter for another tool): it belongs in that tool's environment, i.e.
# `--with`, because `uv tool install <adapter>` fails with "No executables are
# provided by package".
#
# The Python side is deliberately all `uv tool`: no virtualenv, no system Python,
# no pip. uv downloads its own interpreter, so a machine needs nothing but uv.
#
# No Python tool is pinned right now.
